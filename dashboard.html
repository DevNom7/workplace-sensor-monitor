<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Naim's Workplace Sensor Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #0f1117;
            color: #ffffff;
            padding: 40px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        h1 { font-size: 24px; font-weight: 600; }
        h1 span { color: #4f8ef7; }
        button {
            background: #4f8ef7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #3a7de8; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: #1a1d27;
            border-radius: 12px;
            padding: 24px;
            border-left: 4px solid #4f8ef7;
            transition: all 0.3s ease;
        }
        .card.alert { border-left-color: #ef4444; }
        .card.warning { border-left-color: #f59e0b; }
        .card.ok { border-left-color: #22c55e; }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .room-name { font-size: 16px; font-weight: 600; }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-badge.ok { background: #166534; color: #22c55e; }
        .status-badge.warning { background: #78350f; color: #f59e0b; }
        .status-badge.alert { background: #7f1d1d; color: #ef4444; }
        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .metric {
            background: #0f1117;
            border-radius: 8px;
            padding: 16px;
        }
        .metric-label {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .metric-value { font-size: 28px; font-weight: 700; }
        .metric-value.hot { color: #ef4444; }
        .metric-value.warm { color: #f59e0b; }
        .metric-value.cool { color: #22c55e; }
        .occupancy-bar {
            margin-top: 16px;
            background: #0f1117;
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
        }
        .occupancy-fill {
            height: 100%;
            border-radius: 4px;
            background: #22c55e;
            transition: width 0.5s ease;
        }
        .occupancy-fill.high { background: #ef4444; }
        .occupancy-fill.medium { background: #f59e0b; }
        .last-updated {
            text-align: center;
            color: #6b7280;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>🏢 Workplace <span>Sensor Monitor</span></h1>
    <button onclick="simulate()">⚡ Simulate Sensors</button>
</header>

<div class="grid" id="grid">
    <p style="color:#6b7280">Loading rooms...</p>
</div>

<p class="last-updated" id="updated"></p>

<script>
    const API = "http://127.0.0.1:8001";

    function getTempClass(temp) {
        if (temp > 80) return "hot";
        if (temp > 75) return "warm";
        return "cool";
    }

    function getOccupancyClass(occupancy, capacity) {
        const ratio = occupancy / capacity;
        if (ratio >= 0.9) return "high";
        if (ratio >= 0.6) return "medium";
        return "";
    }

    function renderRooms(rooms) {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        Object.entries(rooms).forEach(([id, room]) => {
            const occupancyPct = Math.round((room.occupancy / room.capacity) * 100);
            const tempClass = getTempClass(room.temperature);
            const occClass = getOccupancyClass(room.occupancy, room.capacity);

            grid.innerHTML += `
                <div class="card ${room.status}">
                    <div class="card-header">
                        <span class="room-name">${room.name}</span>
                        <span class="status-badge ${room.status}">${room.status}</span>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <div class="metric-label">🌡 Temperature</div>
                            <div class="metric-value ${tempClass}">${room.temperature}°F</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">👥 Occupancy</div>
                            <div class="metric-value">${room.occupancy}/${room.capacity}</div>
                        </div>
                    </div>
                    <div class="occupancy-bar">
                        <div class="occupancy-fill ${occClass}" 
                             style="width:${occupancyPct}%"></div>
                    </div>
                </div>
            `;
        });

        document.getElementById("updated").textContent =
            `Last updated: ${new Date().toLocaleTimeString()}`;
    }

    async function fetchRooms() {
        const res = await fetch(`${API}/rooms`);
        const data = await res.json();
        renderRooms(data);
    }

    async function simulate() {
        const res = await fetch(`${API}/simulate`);
        const data = await res.json();
        renderRooms(data);
    }

    fetchRooms();
</script>

</body>
</html>
